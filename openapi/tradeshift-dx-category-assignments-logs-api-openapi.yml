paths:
  /rest/external/assignments/{id}/logs:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: An UUID representing the assignment id.
    get:
      responses:
        '200':
          description: 'Successfully returns the assignment by id and all its assignmentLogs. <br> ModifiedBy field shows the last user that has changed the status of an assignment. The user id is taken from the request context.

            '
