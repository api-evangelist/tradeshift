                    description: String representation of an Universally unique identifier (UUID), version 5. See RFC 4122
                    type: string
      description: 'This resource allows to store a document within the Tradeshift platform. The actual document content is
        sent

        as the entity/body of the API call. The client can decide on the UUID for the new element defined by the

        "documentId" parameter. Saving a document as draft will use the document content as primary source for tradeshift
        internal

        conversion which will output a new TSUBL content overwriting the initial one. By doing so extra connection checks
        will occur.

        Otherwise, saving it as a non-draft will not alter the provided UBL document content and will set it as the primary
        source for the document. In both cases,

        the uploaded document will show up as editable in the UI. If the cliend decides that the document should not be editable,
        then it''s state can be locked with a PUT request.

        More details about how to lock a draft document can be found in [Lock a Draft Document](#put-rest-external-documents-documentid-lockedstate-state)

        section. If a document contains attachments at /AdditionalDocumentReference/Attachment/EmbeddedDocumentBinaryObject
        path,

        it will be added to the document. If the document already exists, attachments with already used filename will overwrite
        previous versions.

        Attachments with new file names will be appended to the list of attachments on the document. More details about how
        to remove document attachments

        can be found in [Delete Document Attachment](#delete-rest-external-documents-documentid-attachments-name-content)
        section.

