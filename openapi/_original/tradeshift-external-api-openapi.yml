    - name: documentId
      in: path
      required: true
      schema:
        type: string
      description: Document UUID identifier
    get:
      responses:
        '201':
          description: The document import request finished successfully with the 'Location' header pointing to the created
            draft document.
        '202':
          description: The document import request is still processing.
        '400':
          description: The document import request has failed due to an invalid input. A list of ValidationErrors is provided.
        '401':
          description: User is not authorized to access the provided responseId.
        '404':
          description: The provided dispatch ID does not exist.
        '500':
          description: The document import request has failed due to internal errors.
      description: 'This resource allows the client to verify the response to an asynchronous import request. The API provides
        additional information

        regarding the latest import request of a document. The returned data can either contain a list of document validation
        errors which prevented the

        import to run successfully or an import failed message if there were any import failures. If there are no errors returned
        then the

        import has completed successfully and the client will receive HTTP 201 Created. If the document import is still in
        progress then

        HTTP 202 Accepted is returned. The client can decide wheather to inspect the document import status later or not.

        '
      operationId: get-rest-external-documents-documentid-original-responses-responseid
