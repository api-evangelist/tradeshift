        schema:
          type: string
      - name: country
        in: query
        description: 'Must be provided with companyName, to search for an exact company name in a given country. Valid 2-letter
          country codes are listed in the ''countries'' resource.

          '
        schema:
          type: string
      - name: identifierScheme
        in: query
        description: 'Identifier scheme used to identify the company (one of the ''companytypes'' resource) Each pair of identifierScheme
          and identifierValue will be interpreted as OR.

