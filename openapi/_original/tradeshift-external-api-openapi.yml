- name: dx-category--overview-introduction
  description: This is the developer documentation for the Tradeshift API. The Tradeshift API is REST based and allows integrators
    to handle a number of resources for tasks such as managing business documents, retrieving sender and receiver information,
    and dispatching documents to receivers.
- name: dx-category--overview-make_a_request
  description: 'The easiest way to get started working with the Tradeshift API is to create OAuth credentials by activating
    the [API Access to Own Account](https://sandbox.tradeshift.com/#/apps/Tradeshift.AppStore/apps/Tradeshift.APIAccessToOwnAccount)
    app. The app will display your credentials as four values: a consumer key, a consumer secret, a token, and a token secret.
    Copy these to a secure location so you can access them later.


    We recommend using an app like [Postman](https://www.getpostman.com/apps) to easily explore the API. The OAuth 1.0 credentails
    you just created can then be added to Postman as [explained in their docs](https://www.getpostman.com/docs/postman/sending_api_requests/authorization#oauth-10).
    To summarize:


    - Select "OAuth 1.0" from the "Type" dropdown on the "Authorization" tab

    - Select "Request Headers" from the "Add authorization data to" dropdown

    - Enter your consumer key, consumer secret, access token and token secret

    - Select "HMAC-SHA1" from the "Signature Method" dropdown

    - Leave the other fields blank

    - Switch to the "Headers" tab and add the "Accept: application/json"


    To confirm you have it setup correctly, make a request to `GET https://api-sandbox.tradeshift.com/tradeshift/rest/external/account/info`
    and you should get back information about your company.


    ### Authentication in Apps


    For your app to make API calls as a user, you''ll use the 3-legged OAuth 2 flow to authenticate. Read about [OAuth2 and
    how to set it up](/docs/guides/oauth).'
- name: dx-category--overview-building_blocks
  description: 'Tradeshift apps support collaboration and document exchange among networked companies and individual users.
    Accounts (companies and users), network, and documents are the building blocks of the Tradeshift app platform.


    ### Account/Company


    An account represents a company that can exchange business documents with other companies. Accounts are also called companies
    or company accounts to be differentiated from individual users. An account can be characterized by its account info and
    branch structure. An account can have multiple users.


    #### Branches


    Tradeshift supports a 2-level hierarchy that allows an account to have child accounts. When accounts are linked according
    to some master-children relationship, these linked accounts are also called branches.


    #### Master branch/Master account


    An administrative account used to organize child accounts belonging to the same organization, e.g., ABC Global Enterprise
    master branch. Any account technically can be a master branch as long as it is not already another account''s child branch.


    #### Child branch/Child account


    An account that belongs to a master branch, e.g., ABC Global Enterprise USA Division child branch. Any account technically
    can be a child branch as long as it is not already another account''s master branch.


    #### Account info


    This would typically include attributes such as name, address, country, tax IDs, etc.


    #### Users


    Users must be created within a company account. When a user logs in, the user is inside a company account and can access
    documents and information in that account. If created within a master branch, the user can switch between child branches
    that belong to the same master branch. If created within a child branch, the user can not switch to other branches.


    #### User info


    Meant to include name, email, spend limits, reporting relationship, etc.


    ### Network


    The collection of accounts connected to each other in a multiple-to-multiple relationship. All accounts on Tradeshift
    collectively form the Tradeshift network. Meanwhile, each account can invite its business partners to join its own network
    (similar to how social network websites work).


    #### Connections


    A link between two accounts. A connection needs to be active for the two connected accounts to exchange documents. To
    establish a connection, an account must send a connection request to another account, and the other account must accept
    the connection request.


    #### External connection


    This is also colloquially known as _manual connection_ - a placeholder account you created for the business partner you
    want to connect with. You filled out the account''s profile including name, email address, etc. The business partner has
    not accepted the connection request, or activated its account yet. You may still update the account''s information such
    as name and email. Generally, an external connection is temporary. Once the business partner activates the placeholder
    account, the connection turns into a Tradeshift connection. You will no longer be able to change the account profile information.


    #### Tradeshift connection


    This is also colloquially known as _active connection_ - the company invited to connect has accepted invitation. The invited
    company is ready to send and receive documents. The invited company owns its account info such as name and email. You
    may not change their account info.


    #### Connection property


    Self-defined properties to characterize a connection. For example, a buyer company may store its internal vendor ID as
    a connection property on each supplier connection. Symmetrically, the supplier company on the other side may store its
    internal customer ID as a connection property.


    #### Groups


    An account’s own created groups to categorize connections. Naming and definition is determined by the account. E.g., a
    buyer company may have suppliers in two groups: suppliers required to have purchase orders, and suppliers not required
    to have purchase orders.


    ### Documents/ Document files


    Business documents exchanged between companies in such business transactions as tendering, quotation, buying, shipping,
    invoicing, and so on.


    #### UBL


    A library of standard electronic XML business documents such as purchase orders and invoices. This is the preferred standard
    document format used on Tradeshift. The standards are developed by OASIS (Organization for the Advancement of Structured
    Information Standards). For more information, see <https://www.oasis-open.org/committees/ubl>.


    #### TSUBL


    TSUBL includes a subset of documents under UBL 2.0 standards. [Download](http://tradeshift.com/wp-content/uploads/TSUBL_20190213.zip)
    the TSUBL specifications and sample files, or go to <http://integrate.tradeshift.com> and click "UBL" in the "Supported
    formats" section.


    #### Tenant Isolation


    No direct sharing of data between tenants (accounts). There is storage associated with each account. When sending a document,
    a copy of the sender''s document is created and rendered in the receiver''s account. Therefore, there is no direct sharing
    of data between tenants. Depending on the context, actions on one copy of the document may or may not affect the other
    copy. For example:


    - A supplier (sender) deleting a sent invoice will make that invoice disappear in the supplier''s account. However, the
    buyer (receiver) can still see that invoice in the buyer''s account because the buyer''s copy of that invoice is not affected.
    In this case, action on the sender''s copy of the invoice does not affect the receiver''s copy.

    - A buyer (receiver) updates the status of a received invoice to "Accepted". This will trigger a status message to the
    supplier (sender) account to update the supplier''s copy of the invoice to "Accepted". In this case, action on receiver''s
    copy of the invoice automatically affects the sender''s copy.'
- name: dx-category--overview-key_concepts
  description: '- REST API: the Tradeshift API is based on HTTPS, REST, and OAuth. It allows developers to use HTTP PUT/POST/GET/DELETE
    to access "resources" such as dispatching documents, creating users, and connecting with other accounts. It is used by
    both Tradeshift and third-party developers.

    - OAuth: Tradeshift supports OAuth1 (deprecated, backward compatibility only) and OAuth2 for developers to obtain permissions
    to access user resources. For more on OAuth, see <http://oauth.net/>.

    - UUID: universally unique identifier that is used to identify entities on Tradeshift. According to Wikipedia, UUID is
    an identifier standard used in software construction. Tradeshift uses a canonical format using hexadecimal text with inserted
    hyphen characters, e.g., de305d54-75b4-431b-adb2-eb6b9e546014. There are Javascript and free websites that can generate
    UUIDs. For example, <https://www.uuidgenerator.net/> and <https://github.com/kelektiv/node-uuid>

    - Standards: Tradeshift follows standards where it is applicable for codes such as country code, currency code, tax code,
    etc. Developers need to use the same codes when using Tradeshift documents or parameters. Here is a list of standards
    (not exhaustive) that Tradeshift follows. For the complete set of standards and values, see the [TSUBL specifications](http://tradeshift.com/wp-content/uploads/TSUBL_20190213.zip),
    or go to <http://integrate.tradeshift.com>.

    - Currency code: ISO 4217. Example: USD for US dollars.

    - Country code: ISO 3166. Example: US for United States.

    - Tax category: UN/ECE 5305. Example: Z for zero rated goods

    - Tax scheme: UN/ECE 5153 Subset. Example: STT for state/provincial sales tax.

    - Units of measure: UN/ECE rec 20. Example: EA for each.'
