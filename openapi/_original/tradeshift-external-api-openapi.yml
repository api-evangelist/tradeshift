          type: string
      - name: identifierValue
        in: query
        description: Company identifier to search for (according to the given identifierScheme)
        schema:
          type: string
      - name: email
        in: query
        description: E-mail address of one of the users of the company.
        schema:
          type: string
      - name: existingConnectionsOnly
        in: query
        description: Limit results to only existing connections or only potential connections. Defaults to returning both
          existing and potential connections.
        schema:
          type: boolean
      - name: limit
        in: query
        description: Maximum number of results to display, and size of each page to skip.
        schema:
          default: 25
          minimum: 0
          maximum: 100
          type: number
      - name: page
        in: query
        description: Number of pages of results to skip
        schema:
          default: 0
          type: number
      - name: propertyKey
        in: query
        description: Name of a property set on the connection.
        schema:
          type: string
      - name: propertyValue
        in: query
        description: Value of the specified property name on the connection.
        schema:
          type: string
      - name: includeShareableIdentifiers
        in: query
        description: Applicable when searching by identifiers. If enabled also include results where matching identifiers
          are shareable. Disabled by default.
        schema:
          default: false
          type: boolean
      x-annotation-dx-category: network-search
      summary: find network suggestions
      tags:
      - dx-category--network-search
