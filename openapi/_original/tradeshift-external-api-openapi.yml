      description: 'Search for existing or potential connections based on criteria. One of the following parameter combinations
        needs to be provided - country and companyName, identifierScheme and identifierValue, propertyKey and propertyValue,
        or email. All criteria are matched using exact, case-insensitive match unless exactMatch is set as false.

        '
      operationId: get-rest-external-network-suggest
