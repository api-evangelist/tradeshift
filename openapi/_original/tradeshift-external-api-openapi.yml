        description: The limit of the result set to return, also page size
        schema:
          default: 10
          type: integer
      - name: type
        in: query
        description: Type of the assignment to include in the result set
        schema:
          type: string
      x-annotation-dx-category: documents-assignments
      summary: get user assignments sparse
      tags:
      - dx-category--documents-assignments
  /rest/external/documents/companies/{owningCompanyId}/{documentId}:
    parameters:
    - name: owningCompanyId
      in: path
      required: true
      schema:
        type: string
      description: UUID identifier of company account owning the document.
    - name: documentId
      in: path
      required: true
      schema:
        type: string
      description: Document UUID identifier
    get:
      responses:
        '307':
          description: 'Successful response

            '
          headers:
            Location:
              schema:
                type: string
        '404':
          description: 'Document not found or the security check do not pass

            '
      description: 'Retrieves a document in the context of an owning company. If the supplied authentication context has access
        to

        see document identified by {documentId}, meaning the sender of the document, then returns a redirect to GET the document
        with {documentId}.

        If the supplied authentication context does not have access to the document, then checks to see if it has

        access to a document that references the supplied {documentId}, and returns a redirect to GET that referencing document
        instead.

        This endpoint is used for example when the receiver of a document does not know the id of the document from

        his side, but instead knows the company who sent it and the document id from that company context. The response

        will be a redirect to GET a content of the document accessible by the receiver.

        This only works if a sender tries to access one of its documents, or a receiver tries to find a content based

        on a sender side reference id. It does not work for if a sender tries to access a document content based on the

        reference to a receiver side, because this information is stored only on the receiver side copy of the document.

        '
      operationId: get-rest-external-documents-companies-owningcompanyid-documentid
      parameters:
      - name: Accept
        in: header
        required: true
        description: 'The MIME media type of the response content. Example: text/xml, application/json, application/*

          '
        schema:
          default: text/xml
          type: string
      x-annotation-dx-category: documents-document
      summary: Get company document
      tags:
      - dx-category--documents-document
  /rest/external/documents/csv:
    get:
      responses:
        '200':
          description: The list of documents as text/csv.
        '400':
          description: Bad request error
        '406':
          description: The request uses Accept headers that the server is unable to fulfill
      description: Gets a list of documents in CSV format for the current user. If multiple criteria are specified, they act
        as logical AND, unless specified otherwise. Drafts are not returned by default, unless stag=draft is specified. Could
        be sorted by DueDate, LastEdit, Number, Amount, Date, Type. The returned mime-type is always text/csv regardless if
        Accept header is application/csv or text/csv.
      operationId: get-rest-external-documents-csv
      parameters:
      - name: Accept
        in: header
        required: true
        description: Media types which are acceptable for the response. The possible values are application/csv and text/csv.
        schema:
          enum:
          - text/csv
          - application/csv
          type: string
      - name: tag
        in: query
        description: The tag the document must have. Can be used multiple times, which is interpreted as OR unless you set
          useAndOperatorForTags to true, then it will be AND.
        schema:
          type: string
      - name: useAndOperatorForTags
        in: query
        description: It sets the tags based search to meet all criteria within the set of provided filters.
        schema:
          default: false
          type: boolean
      - name: withouttag
        in: query
        description: The tag the document must not have. Can be used multiple times, which is interpreted as AND.
        schema:
          type: string
      - name: propertykey
        in: query
        description: Must be specified together with propertyvalue. Each pair of propertykey and propertyvalue will be interpreted
          as AND.
        schema:
          type: string
      - name: propertyvalue
        in: query
        description: See propertykey.
        schema:
          type: string
      - name: ascending
        in: query
        description: Whether the documents are ordered in ascending or descending order (for last edited date), defaults to
          descending.
        schema:
          default: false
          type: boolean
      - name: type
        in: query
        description: The type of documents to include. Can be used multiple times, which is interpreted as OR.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return. This is also the number of results on each skipped page.
        schema:
          default: 25
          type: integer
      - name: stag
        in: query
        description: The system tag the document must have. Can be used multiple times, which is interpreted as OR. Known
          system include "inbox", "outbox", "draft", "sales", "purchases", "deleted".
        schema:
          type: string
      - name: minissuedate
        in: query
        description: Earliest issue date of documents to match (according to UBL content).
        schema:
          type: string
      - name: maxissuedate
        in: query
        description: Latest issue date of documents to match (according to UBL content).
        schema:
          type: string
      - name: createdBefore
        in: query
        description: Limits documents to those which were created before the given timestamp, formatted as a XSD-timestamp.
        schema:
          type: string
      - name: createdAfter
        in: query
        description: Limits documents to those which were created after the given timestamp, formatted as a XSD-timestamp.
        schema:
          type: string
      - name: state
        in: query
        description: 'Represents the state (e.g. SENT, DELIVERED, ACCEPTED) of the searched documents.

          Can be used multiple times, which is interpreted as OR.

          Accepted values are: UNDETERMINED, IN_TRANSIT, PENDING_NOT_A_CONTACT, FAILED_DELIVERY, SENT, DELIVERED, ACCEPTED,
          OVERDUE, PAID_UNCONFIRMED, PAID_CONFIRMED, REJECTED_BY_SENDER, REJECTED_BY_RECEIVER, DISPUTED_BY_RECEIVER, CLOSED,
          REPLACED, AWAITING_ASSISTANCE, ASSISTANCE_PROVIDED, CANCELED, ASSISTANCE_CANCELED, PUNCHOUT_SENT, PUNCHOUT_EDIT.

          '
        schema:
          type: string
      - name: ordering
        in: query
        description: Result ordering (e.g. DueDate, Amount, Date).
        schema:
          default: LastEdit
          type: string
      - name: sales
        in: query
        description: Whether document is sale or not.
        schema:
          type: boolean
      - name: query
        in: query
        description: Text to search.
        schema:
          type: string
      - name: copyIndicator
        in: query
        description: Whether to search only copies of documents, originals or both.
        schema:
          type: boolean
      - name: onlycopies
        in: query
        description: Whether to search only copies of documents.
        schema:
          default: false
          type: boolean
      - name: conversationId
        in: query
        description: The document conversation id used for getting its related documents.
        schema:
          type: string
      - name: totalFrom
        in: query
        description: It represents the minimum value of the total range that can be used to filter documents.
        schema:
          type: number
      - name: totalTo
        in: query
        description: It represents the maximum value of the total range that can be used to filter documents.
        schema:
          type: number
      - name: currency
        in: query
        description: It represents the currency that can be used to filter documents only of that currency.
        schema:
          type: string
      - name: useOrOperatorForProperties
        in: query
        description: It sets the property based search to meet at least one criteria within the set of provided filters.
        schema:
          type: boolean
      - name: page
        in: query
        description: Result page to return. Each page has 'limit' number of results.
        schema:
          default: 0
          type: integer
      - name: id
        in: query
        description: The documents to get DocumentInformation for (a Tradeshift UUID value)
        schema:
          type: string
      - name: sentBy
        in: query
        description: Sender company tenant id (a Tradeshift UUID value).
        schema:
          type: string
      - name: sentTo
        in: query
        description: Receiver company tenant ids (a Tradeshift UUID value).
        schema:
          type: string
      - name: processState
        in: query
        description: The _user_ state the document must have (see /metadata). Can be used multiple times, which is interpreted
          as OR. Note that this parameter is misnamed as it searches among all user states, not just process state.
        schema:
          type: string
      - name: withoutProcessState
        in: query
        description: The process state the document must not have (see /metadata). Can be used multiple times, which is interpreted
          as AND. Note that this parameter is misnamed as it searches among all user states, not just process state.
        schema:
          type: string
      - name: branchId
        in: query
        description: Document business ids. Can be used multiple times, which is interpreted as OR.
        schema:
          type: string
      - name: totals
        in: query
        description: Whether to calculate the documents total amount or not.
        schema:
          default: false
          type: boolean
      - name: onlydrafts
        in: query
        description: Whether to search only drafts.
        schema:
          default: false
          type: boolean
      - name: onlydeleted
        in: query
        description: Whether to search only deleted documents.
        schema:
          default: false
          type: boolean
      - name: requesterId
        in: query
        description: 'This field can be used to filter documents by the given list of requester Ids, only applicable for Purchase
          Request Documents. The requester is either the creating person or the document or if specified the "on behalf of"
          person

          '
        schema:
          type: string
      - name: invoiceTypeCode
        in: query
        description: 'This field represents the type of invoice for an invoice document. If the field is missing then we will
          have a normal/commercial invoice filter. For value 325 proforma invoice type will be searched and for value 386
          we will have prepayment invoice.

          '
        schema:
          type: array
          items:
            type: number
      - name: profileId
        in: query
        description: It represents the profile id of a given document.
        schema:
          type: string
      x-annotation-dx-category: documents-document
      summary: find documents (CSV support)
      tags:
      - dx-category--documents-document
