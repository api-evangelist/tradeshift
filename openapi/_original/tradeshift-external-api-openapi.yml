      description: 'Get a paginated list of assignments filtered by the following query parameters. The search will be performed
        on assignments from the current branch and child branches.

        '
      operationId: get-rest-external-assignments
      parameters:
      - name: companyid
        in: query
        description: Company (tenant) UUID used to filter assignments.
        schema:
          type: string
      - name: assigneeids
        in: query
        description: List of  UUIDs of assignees, used to filter assignments.
        schema:
          type: string
      - name: with_tags
        in: query
        description: List of strings representing tags to be used to filter assignments.
        schema:
          type: string
      - name: without_tags
        in: query
        description: List of strings representing tags to be used to exclude assignments.
        schema:
          type: string
      - name: status
        in: query
        description: List of statuses to be used to filter assignment (e.g. OPEN, CLOSED, WAITING_FOR_ASSIGNEES)
        schema:
          type: string
      - name: type
        in: query
        description: String representing a type used to filter assignments.
        schema:
          type: string
      - name: type_category
        in: query
        description: String representing a type category(a collection of assignment types)
        schema:
          type: string
      - name: created_from
        in: query
        description: Datetime used to get assignments created after this date.
        schema:
          type: string
      - name: created_to
        in: query
        description: Datetime used to get assignments created before this date.
        schema:
          type: string
      - name: modified_from
        in: query
        description: Datetime used to get assignments modified after this date.
        schema:
          type: string
      - name: modified_to
        in: query
        description: Datetime used to get assignments modified before this date.
        schema:
          type: string
      - name: subjectid
        in: query
        description: 'Represents a free form identifier ( usually a document UUID ) of the subject the assignment is referring
          to and can be used to search assignments by.

          '
        schema:
          type: string
      - name: externalid
        in: query
        description: 'Free form string representing a custom client identifier which can be used later to search assignments
          by. Assignments service makes no uniqueness validation on this identifier.

          '
        schema:
          type: string
      - name: page
        in: query
        description: Number representing the page to be return from the paginated result-set.
        schema:
          default: 0
          type: integer
      - name: limit
        in: query
        description: The number of assignments displayed per page.
        schema:
          default: 20
          type: integer
      - name: sortby
        in: query
        description: The sorting field.
        schema:
          type: string
      - name: direction
        in: query
        description: The sorting direction.
        schema:
          type: string
      x-annotation-dx-category: assignments-find
      summary: find assignments
      tags:
      - dx-category--assignments-find
