      schema:
        type: string
      description: Document UUID identifier
    get:
      responses:
        '200':
          description: property "receiverCompanyId" found and value returned
          content:
            text/plain:
              schema:
                example: a74cd946-6a08-11eb-9439-0242ac130002
                type: string
        '204':
          description: property "receiverCompanyId" not found and no value returned
        '404':
          description: document not found
      description: 'This endpoint allows the retrieval of the “receiverCompanyId” tag, using a document id.

        During the dispatch, the receiver side copy of the document is tagged with additional information.

        One of the tags included is the “receiverCompanyId” which represents the company that receives the document.

        Because this tag is only computed during the dispatch, it is only available on the receiver side copy of the

        document and it will most likely be the company itself, but in case of forwarding it will be the original receiver.

        This is useful when an account has multiple child branches, and a user in the primary account wants to do a

        filtered search for documents received by one of the branches.

        '
      operationId: get-rest-external-documents-documentid-receivercompany
      parameters:
      - name: Accept
        in: header
        required: true
        description: media type of the response content it is expecting
        schema:
          default: text/plain
          type: string
      x-annotation-dx-category: documents-document
      summary: Get document's receiver company
      tags:
      - dx-category--documents-document
  /rest/external/documents/{documentId}/senderReferenceId:
    parameters:
    - name: documentId
      in: path
      required: true
      schema:
        type: string
      description: Document UUID identifier
    get:
      responses:
        '200':
          description: property "reference" found and value returned
          content:
            text/plain:
              schema:
                example: a74cd946-6a08-11eb-9439-0242ac130002
                type: string
        '404':
          description: document or property not found
      description: 'This endpoint returns the referenced document''s id for a given document.

        During the dispatch, fx. sending a document to another account, a copy is created on the receiver side so that

        each side of the transaction has it''s own copy of the document.

        The receiver side copy of the document is tagged with additional information and one of the tags that are added

        is the “reference” tag, which represents the document id of the sender side copy.

        Because this tag is only computed during the dispatch, it is only available on the receiver side copy and it

        is not availble on the sender side.

        This tag is useful to link the two copies of the document together, and can be used by API integrations to

        easily retrieve the sender side copy.

        '
      operationId: get-rest-external-documents-documentid-senderreferenceid
      parameters:
      - name: Accept
        in: header
        required: true
        description: media type of the response content it is expecting
        schema:
          default: text/plain
          type: string
      x-annotation-dx-category: documents-document
      summary: Get document's referenced id
      tags:
      - dx-category--documents-document
  /rest/external/documents/{documentId}/sendercompany:
    parameters:
    - name: documentId
      in: path
      required: true
      schema:
        type: string
      description: Document UUID identifier
    get:
      responses:
        '200':
          description: property "senderCompanyId" found and value returned
          content:
            text/plain:
              schema:
                example: a74cd946-6a08-11eb-9439-0242ac130002
                type: string
        '204':
          description: property "senderCompanyId" not found and no value returned
        '404':
          description: document not found
      description: 'This endpoint allows the retrieval of the “senderCompanyId” tag, using a document id.

        During the dispatch, fx. sending a document to another account, a copy is created on the receiver side so

        that each side of the transaction has it''s own copy of the document. The receiver side copy is tagged with

        additional information and one of the tags that are added is the “senderCompanyId” tag, which represents the

        id of the sender account.

        Because this tag is only computed during the dispatch, it is only available on the receiver side copy and it

        is not available on the sender side.

        Use this API to uniquely identify the company in Tradeshift that initiated the dispatch.

        '
      operationId: get-rest-external-documents-documentid-sendercompany
      parameters:
      - name: Accept
        in: header
        required: true
        description: media type of the response content it is expecting
        schema:
          default: text/plain
          type: string
      x-annotation-dx-category: documents-document
      summary: Get document's sender company
      tags:
      - dx-category--documents-document
