        '400':
          description: Bad request error
        '406':
          description: The request uses Accept headers that the server is unable to fulfill
      description: Gets a list of documents for the current user in XML or JSON format depending on the request Accept header.
        If multiple criteria are specified, they act as logical AND, unless specified otherwise. Drafts are not returned by
        default, unless stag=draft is specified. The return list of documents can be sorted by DueDate, LastEdit, Number,
        Amount, Date, Type.
      operationId: get-rest-external-documents
      parameters:
      - name: Accept
        in: header
        required: true
        description: Media types which are acceptable for the response. The possible values are text/xml and application/json.
        schema:
          enum:
          - application/xml
          - application/json
          type: string
      - name: tag
        in: query
        description: The tag the document must have. Can be used multiple times, which is interpreted as OR unless you set
          useAndOperatorForTags to true, then it will be AND.
        schema:
          type: string
      - name: useAndOperatorForTags
        in: query
        description: It sets the tags based search to meet all criteria within the set of provided filters.
        schema:
          default: false
          type: boolean
      - name: withouttag
        in: query
        description: The tag the document must not have. Can be used multiple times, which is interpreted as AND.
        schema:
          type: string
      - name: propertykey
        in: query
        description: Must be specified together with propertyvalue. Each pair of propertykey and propertyvalue will be interpreted
          as AND by default unless you set useOrOperatorForProperties to true, then it will be OR.
        schema:
          type: array
          items:
            type: string
      - name: propertyvalue
        in: query
        description: See propertykey.
        schema:
          type: array
          items:
            type: string
      - name: useOrOperatorForProperties
        in: query
        description: It sets the property based search to meet at least one criteria within the set of provided filters.
        schema:
          type: boolean
      - name: ascending
        in: query
        description: Whether the documents are ordered in ascending or descending order (for last edited date), defaults to
          descending.
        schema:
          default: false
          type: boolean
      - name: type
        in: query
        description: The type of documents to include. Examples of document types 'invoice', 'creditnote'. Can be used multiple
          times, which is interpreted as OR.
        schema:
          type: string
      - name: page
        in: query
        description: Result page to return. Each page has 'limit' number of results.
        schema:
          default: 0
          type: integer
      - name: limit
        in: query
        description: Maximum number of results to return. This is also the number of results on each skipped page. Capped
          to 100. If _onlyIndex is set to true, includesourcedocuments and populatePersonInfo to false value is capped to
          10000.
        schema:
          default: 25
          type: integer
      - name: id
        in: query
        description: The documents to get DocumentInformation for (a Tradeshift UUID value)
        schema:
          type: string
      - name: businessId
        in: query
        description: Limits documents to those with the given business id (invoice/credit note/purchase order number, e.g.
          'ABC-123'). Note that business ids are not guaranteed to be unique for received documents, and may potentially be
          duplicated for different documents, even sent by the same supplier.
        schema:
          type: string
      - name: sentBy
        in: query
        description: Sender company tenant id (a Tradeshift UUID value).
        schema:
          type: string
      - name: sentTo
        in: query
        description: Receiver company tenant ids (a Tradeshift UUID value).
        schema:
          type: string
      - name: stag
        in: query
        description: The system tag the document must have. Can be used multiple times, which is interpreted as OR. Known
          system include "inbox", "outbox", "draft", "sales", "purchases", "deleted".
        schema:
          type: string
      - name: minissuedate
        in: query
        description: Earliest issue date of documents to match (according to UBL content).
        schema:
          type: string
      - name: maxissuedate
        in: query
        description: Latest issue date of documents to match (according to UBL content).
        schema:
          type: string
      - name: since
        in: query
        description: Limits documents to those which have changed since the given timestamp, formatted as a XSD-timestamp.
        schema:
          type: string
      - name: createdBefore
        in: query
        description: Limits documents to those which were created before the given timestamp, formatted as a XSD-timestamp.
        schema:
          type: string
      - name: createdAfter
        in: query
        description: Limits documents to those which were created after the given timestamp, formatted as a XSD-timestamp.
        schema:
          type: string
      - name: processState
        in: query
        description: The _user_ state the document must have (see /metadata). Can be used multiple times, which is interpreted
          as OR. Note that this parameter is misnamed as it searches among all user states, not just process state.
        schema:
          type: string
      - name: withoutProcessState
        in: query
        description: The process state the document must not have (see /metadata). Can be used multiple times, which is interpreted
          as AND. Note that this parameter is misnamed as it searches among all user states, not just process state.
        schema:
          type: string
      - name: branchId
        in: query
        description: Document business ids. Can be used multiple times, which is interpreted as OR.
        schema:
          type: string
      - name: totals
        in: query
        description: Whether to calculate the documents total amount or not.
        schema:
          default: false
          type: boolean
      - name: state
        in: query
        description: 'Representing the state (e.g. SENT, DELIVERED, ACCEPTED) of the searched documents.

          Can be used multiple times, which is interpreted as OR.

          Accepted values are: UNDETERMINED, IN_TRANSIT, PENDING_NOT_A_CONTACT, FAILED_DELIVERY, SENT, DELIVERED, ACCEPTED,
          OVERDUE, PAID_UNCONFIRMED, PAID_CONFIRMED, REJECTED_BY_SENDER, REJECTED_BY_RECEIVER, DISPUTED_BY_RECEIVER, CLOSED,
          REPLACED, CORRECTED, IN_ENRICHMENT, IN_CLEARANCE, COLLECTED, AWAITING_ASSISTANCE, ASSISTANCE_PROVIDED, CANCELED,
          ASSISTANCE_CANCELED, PUNCHOUT_SENT, PUNCHOUT_EDIT.

          '
        schema:
          type: string
      - name: ordering
        in: query
        description: Field that indicates the criteria on which result will be ordered upon returning (e.g. DueDate, Amount,
          Date).
        schema:
          default: LastEdit
          type: string
      - name: sales
        in: query
        description: This parameter decides whether the transaction type of selected documents should be sale or not.
        schema:
          type: boolean
      - name: query
        in: query
        description: 'This parameter defines the specific text to be searched within the documents. It can include a single
          or

          multiple words or phrases and documents that match the search condition will be returned.

          '
        schema:
          type: string
      - name: copyIndicator
        in: query
        description: Whether to search only copies of documents, originals or both.
        schema:
          type: boolean
      - name: onlycopies
        in: query
        description: Whether to search only copies of documents.
        schema:
          default: false
          type: boolean
      - name: onlydrafts
        in: query
        description: Whether to search only drafts.
        schema:
          default: false
          type: boolean
      - name: onlydeleted
        in: query
        description: Whether to search only deleted documents.
        schema:
          default: false
          type: boolean
      - name: includesourcedocuments
        in: query
        description: Whether to include the raw UBL document in the result. The UBL documents are stripped of attachments
          before they are returned.
        schema:
          default: false
          type: boolean
      - name: waitForIndex
        in: query
        description: Whether to wait for pending documents to be indexed.
        schema:
          default: true
          type: boolean
      - name: _onlyIndex
        in: query
        description: This flag allows document listing using exclusively the data from the index.
        schema:
          default: false
          type: boolean
      - name: conversationId
        in: query
        description: The document conversation id used for getting its related documents.
        schema:
          type: string
      - name: totalFrom
        in: query
        description: It represents the minimum value of the total range that can be used to filter documents.
        schema:
          type: number
      - name: totalTo
        in: query
        description: It represents the maximum value of the total range that can be used to filter documents.
        schema:
          type: number
      - name: currency
        in: query
        description: It represents the currency that can be used to filter documents only of that currency.
        schema:
          type: string
      - name: requesterId
        in: query
        description: 'This field can be used to filter documents by the given list of requester Ids, only applicable for Purchase
          Request Documents. The requester is either the creating person or the document or if specified the "on behalf of"
          person

          '
        schema:
          type: string
      - name: invoiceTypeCode
        in: query
        description: 'This field represents the type of invoice for an invoice document. If the field is missing then we will
          have a normal/commercial invoice filter. For value 325 proforma invoice type will be searched and for value 386
          we will have prepayment invoice.

          '
        schema:
          type: array
          items:
            type: number
      - name: accountingSystemId
        in: query
        description: 'This field represents a custom value assigned by a client to a connection with a supplier.

          '
        schema:
          type: string
      - name: accountingCost
        in: query
        description: This field represents a custom value assigned by a client refering to a Cost Center.
        schema:
          type: string
      - name: profileId
        in: query
        description: It represents the profile id of a given document.
        schema:
          type: string
      - name: populatePersonInfo
        in: query
        description: Populate person info (actor and requester)
        schema:
          default: true
          type: boolean
      - name: orderTypeCode
        in: query
        description: This field represents the type of order for an order document.
        schema:
          type: array
          items:
            type: number
      - name: orderChangeTypeCode
        in: query
        description: This field represents the type of order for an order change document.
        schema:
          type: array
          items:
            type: number
      x-annotation-dx-category: documents-document
      summary: find documents
      tags:
      - dx-category--documents-document
