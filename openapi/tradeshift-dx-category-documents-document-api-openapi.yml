        '401':
          description: User was not authorized to view the specified document.
      description: Get document property value if found, otherwise return empty response.
      operationId: get-rest-external-documents-documentid-properties-property_key
      parameters:
      - name: Accept
        in: header
        required: true
        description: 'The MIME media type of the response content. Example: text/plain

          '
