        '401':
          description: User was not authorized to view the specified document.
      description: 'Add or update document property (key & value).

        Adding properties can help cross references between Tradeshift and the interfacing system.

        For example, adding an ERP posting number as a property to the document after posting, can help cross

        referencing and reconciliation. The property can then be called e.g. "ERPCode" with a value like "12345".

        While supported it''s not recommended to add properties before the document has been created, as neither

        reading nor writing pre created properties will be supported in future versions of the API.

