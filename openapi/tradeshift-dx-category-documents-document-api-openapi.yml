      description: 'Add or replace a tag on a document. Tags might be visible in the TS user interface, and are shared between

        API accessors. This is a generic document API endpoint which covers all document types. To avoid pulling the

        same document again and again, tag the invoice, and then poll for only documents without this tag in #1.

        A tag is just a string, and a document can have multiple tags. It can be used to keep track of sub steps in

        the integration, for instance Pulled, Transformed and Posted, which would be three tags suitable for

        debugging and integration.

        '
