  /rest/external/documents/assignments/users/{userId}/autoassign/detail:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
      description: User UUID identifier
    get:
      responses:
        '200':
          description: ''
          content:
            text/xml:
              example: "<AutoAssignmentDetail xmlns=\"http://tradeshift.com/api/public/1.0\">\n    <User>\n        <Id>0daab548-3990-41ed-b0f4-eb197e693df1</Id>\n        <CompanyAccountId>093aafb9-2620-4655-885e-888f2a65c59c</CompanyAccountId>\n        <CompanyName>Tradeshift</CompanyName>\n        <Username>steve.armstrong@example.org</Username>\n        <Language>en-us</Language>\n        <TimeZone>GMT</TimeZone>\n        <Memberships>\n            <Membership>\n                <UserId>0daab548-3990-41ed-b0f4-eb197e693df1</UserId>\n                <GroupId>093aafb9-2620-4655-885e-888f2a65c59c</GroupId>\n                <Role>a6a3edcd-00d9-427c-bf03-4ef0112ba16d</Role>\n            </Membership>\n        </Memberships>\n        <Created>2016-06-07T14:29:05.601+02:00</Created>\n        <State>ACTIVE</State>\n        <Type>PERSON</Type>\n        <FirstName>Steve</FirstName>\n        <LastName>Armstrong</LastName>\n        <Title>boss</Title>\n        <Visible>true</Visible>\n    </User>\n    <AutoAssignee>\n        <ExcludeUser>false</ExcludeUser>\n        <UserID>0daab548-3990-41ed-b0f4-eb197e693df1</UserID>\n        <Created/>\n        <IsDelegation>true</IsDelegation>\n        <DelegationType>DELEGATING</DelegationType>\n    </AutoAssignee>\n</AutoAssignmentDetail>\n"
              schema:
                type: object
      description: Returns the auto assignment details of an user.
      operationId: get-rest-external-documents-assignments-users-userid-autoassign-detail
      x-annotation-dx-category: documents-assignments
      summary: get user assignments detail
      tags:
      - dx-category--documents-assignments
  /rest/external/documents/assignments/users/{userId}/autoassign/{autoAssigneeId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
      description: The assignee id
    - name: autoAssigneeId
      in: path
      required: true
      schema:
        type: string
      description: The autoassignee id
    delete:
      responses:
        '200':
          description: The requested auto assignment has been deleted
        '304':
          description: Couldn't find the requested assignment for deletion
      description: Delete one assignment as identified by the path parameters and the requester's group id
      operationId: delete-rest-external-documents-assignments-users-userid-autoassign-autoassigneeid
      parameters:
      - name: groupId
        in: query
        description: Group id associated to this autoassignment. If this is missing, the X-Tradeshift-TenantId header value is used
        schema:
          type: string
      x-annotation-dx-category: documents-assignments
      summary: delete auto assignment
      tags:
      - dx-category--documents-assignments
  /rest/external/documents/assignments/users/{userId}/autoassign/{autoAssigneeId}/delegationType/{delegationType}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
      description: User UUID identifier for the assigner
    - name: autoAssigneeId
      in: path
      required: true
      schema:
        type: string
      description: User UUID identifier for the assignee
    - name: delegationType
      in: path
      required: true
      schema:
        type: string
      description: Type of delegation to be applied
    put:
      responses:
        '204':
          description: Autoassignment created.
        '401':
          description: The requesting user is not a member of the specified security group
      description: Create an autoassignment from userId to autoAssigneeId
      operationId: put-rest-external-documents-assignments-users-userid-autoassign-autoassigneeid-delegationtype-delegationtype
      parameters:
      - name: excludeUser
        in: query
        description: Whether to exclude the user
        schema:
          default: false
          type: boolean
      - name: groupId
        in: query
        description: Group id associated to this autoassignment. If this is missing, the X-Tradeshift-TenantId header value is used
        schema:
          type: string
      x-annotation-dx-category: documents-assignments
      summary: create autoassignment
      tags:
      - dx-category--documents-assignments
  /rest/external/documents/assignments/users/{userId}/autoassigners/detail:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
      description: User UUID identifier
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              example:
                AutoAssigners:
                - User:
                    Id: 0daab548-3990-41ed-b0f4-eb197e693df1
                    CompanyAccountId: 093aafb9-2620-4655-885e-888f2a65c59c
                    CompanyName: Tradeshift
                    Username: steve.armstrong@example.org
                    Language: en
                    TimeZone: GMT
                    Memberships:
                    - UserId: 0daab548-3990-41ed-b0f4-eb197e693df1
                      GroupId: 093aafb9-2620-4655-885e-888f2a65c59c
                      Role: a6a3edcd-00d9-427c-bf03-4ef0112ba16d
                    Created: '2016-06-07T14:29:05.601+02:00'
                    State: ACTIVE
                    Type: PERSON
                    FirstName: Steve
                    LastName: Armstrong
                    Title: boss
                    Visible: true
                  AutoAssignee:
