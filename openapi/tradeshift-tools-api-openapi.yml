openapi: 3.2.0
info:
  title: MCP HTTP Bridge & Management Tools API
  version: 0.1.0
tags:
- name: Tools
paths:
  /tools/list:
    get:
      summary: List All Tools
      description: List all tools across allowed domains.
      operationId: list_all_tools_tools_list_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
      tags:
      - Tools
  /{category}/tools/list:
    get:
      summary: List Category Tools
      operationId: list_category_tools__category__tools_list_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: category
        in: path
        required: true
        schema:
          type: string
          title: Category
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Tools
  /{category}/tools/execute:
    post:
      summary: Execute Category Tool
      operationId: execute_category_tool__category__tools_execute_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: category
        in: path
        required: true
        schema:
          type: string
          title: Category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolExecutionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Tools
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ToolExecutionRequest:
      properties:
        tool:
          type: string
          title: Tool
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
      type: object
      required:
      - tool
      - parameters
      title: ToolExecutionRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
