apis:
  - name: Tradeshift External API
    description: >-
      REST API over the Tradeshift business commerce platform. 172 operations across accounts and branches, legal
      entities, taxes and validations, network connections and connection properties, document profiles, business
      documents and document files, attachments, quotes, requisitions, receipt advices, users and memberships,
      assignments, buyer-sourced documents, and document validation and clearance. JSON and XML (OASIS UBL / TSUBL)
      representations; OAuth 1.0a two-legged or OAuth 2.0 three-legged auth plus a required X-Tradeshift-TenantId
      header.
    humanURL: https://developers.tradeshift.com/docs/api
    baseURL: https://api.tradeshift.com/tradeshift
    tags:
