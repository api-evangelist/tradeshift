aid: tradeshift
name: Tradeshift
description: >-
  Tradeshift is a cloud-based business commerce network for accounts payable automation, e-invoicing compliance,
  procure-to-pay, supplier management, and B2B marketplace commerce, connecting buyers and sellers across more than
  190 countries. The Tradeshift External API is a REST/JSON+XML interface over the same platform its own apps use,
  covering company accounts and branches, legal entities and tax identifiers, network connections and connection
  properties, business documents (invoices, orders, credit notes, quotes, requisitions, receipt advices) in the
  OASIS UBL / TSUBL format, document files and attachments, users and memberships, assignments and workflow, and
  document validation and clearance for country e-invoicing mandates. Authentication is OAuth (OAuth 1.0a two-legged
  for account-scoped integrations, OAuth 2.0 three-legged for apps acting on behalf of users), every call carries an
  X-Tradeshift-TenantId header, and apps can subscribe to platform webhooks for document, network, and user events.
  Tradeshift also runs a production MCP server exposing platform capability to AI agents under the same
  authentication, RBAC, and audit model as human sessions.
