  - name: Tradeshift MCP Server
    description: >-
      Production Model Context Protocol server that exposes Tradeshift platform capability to AI agents, described by
      Tradeshift as 95 tools across six domains (core services, supplier network, documents, company data, the
      Business Firewall, and the AskAda AI assistant / Ada AI document intelligence layer). Built on FastAPI with
      stdio and HTTP+SSE transports, OAuth 2.0 client-credentials with per-domain scopes, tenant isolation, and a
      PostgreSQL audit log of every tool execution. The MCP endpoint and the tools/list surface require
      authentication; anonymous discovery is limited to the RFC 8414 / RFC 9728 metadata documents and the HTTP
      bridge OpenAPI.
    humanURL: https://tradeshift.com/resources/ai/tradeshift-mcp-server-amazon-quick-agentic-ai-accounts-payable/
    baseURL: https://mcp.tradeshift.com/mcp
    tags:
