deprecation:
  policy_url: https://developers.tradeshift.com/docs/deprecation-process
  published: true
  sunset_header: false
  deprecation_header: false
  announced_via:
    - https://developers.tradeshift.com/announcements/
    - monthly release notes
  milestones:
    - id: M1
      name: Deprecation announced
      commitment: At least 9 months before decommission.
      description: >-
        Tradeshift announces on the deprecation page and notifies in monthly release notes, specifying the timetable.
        Clients should start planning migration work.
    - id: M2
      name: Alternative available
      commitment: At least 6 months before decommission.
      description: >-
        APIs that are alternatives to the deprecated API are made available, including documentation and usage
        samples.
    - id: M3
      name: Feature freeze / active deprecation
      commitment: At least 3 months before decommission.
      description: >-
        The API stops receiving regular updates (bug fixes, functionality enhancements); critical issues and security
        vulnerabilities are still fixed. Usage is monitored and clients are notified.
    - id: M4
      name: Decommission
      description: >-
        The API is decommissioned and no longer available; clients still calling it will experience errors.
  quote: >-
    "Tradeshift will strive to give at least 9 months notice before decommision."
