    title: 'Document processed: Notice of Deprecation'
    url: https://developers.tradeshift.com/announcements/2023-02-01-deprecation-document-processed/
    breaking: true
    summary: >-
      tradeshift/rest/external/documents/{documentID}/processed entered the deprecation process prematurely and had
      stopped reliably returning coding information for business documents. M1, M2 and M3 were all past; M4 advised
      for 2023-03-01. Clients advised to migrate to
      tradeshift/rest/external/documents/{documentID}/codingInformation. Applies to all environments and accounts.
