      - com.tradeshift.sdk:tradeshift-sdk-campaign
      - com.tradeshift.sdk:tradeshift-sdk-apps
      - com.tradeshift.sdk:tradeshift-sdk-linelinker
      - com.tradeshift.sdk:tradeshift-sdk-test
      - com.tradeshift.sdk:tradeshift-sdk-codestyle
