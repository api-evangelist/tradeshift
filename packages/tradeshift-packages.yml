generated: '2026-08-02'
method: searched
source: >-
  Maven Central (search.maven.org), npm registry search, github.com/Tradeshift; PyPI, Packagist, NuGet, RubyGems,
  crates.io and pkg.go.dev returned no first-party Tradeshift client library.
note: >-
  Tradeshift's only first-party server-side client library for the External API is the Java SDK published under the
  com.tradeshift.sdk group on Maven Central, split into one artifact per platform domain. The npm @tradeshift scope
  is front-end: the Tradeshift UI framework, the Elements web-component library, and the app-messaging library used
  by apps embedded in the Tradeshift platform — those are catalogued here and in components/. The UBL schema
  artifacts (XSD and JSON Schema) are the document contracts the API exchanges, not API clients.
packages:
  - language: java
    registry: maven-central
    name: com.tradeshift.sdk:tradeshift-sdk
    url: https://central.sonatype.com/artifact/com.tradeshift.sdk/tradeshift-sdk
    version: 0.2.0
    official: true
    kind: sdk
    description: Aggregate Tradeshift Java SDK for the Tradeshift External API.
    modules:
      - com.tradeshift.sdk:tradeshift-sdk-core
      - com.tradeshift.sdk:tradeshift-sdk-accounts
      - com.tradeshift.sdk:tradeshift-sdk-documents
      - com.tradeshift.sdk:tradeshift-sdk-documentfiles
      - com.tradeshift.sdk:tradeshift-sdk-network
      - com.tradeshift.sdk:tradeshift-sdk-workflow
      - com.tradeshift.sdk:tradeshift-sdk-assignments
      - com.tradeshift.sdk:tradeshift-sdk-coding
