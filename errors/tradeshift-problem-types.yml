note: >-
  Tradeshift does not use RFC 9457 / RFC 7807 problem+json. Errors are returned as a proprietary JSON (or text/xml)
  envelope with ErrorCode, Message and an ErrorDetail array of {Key, Value} pairs. This catalog is derived from every
  4xx/5xx and default response declared across the 172 operations in the External API OpenAPI; the ErrorCode values
  are the ones that actually appear in the spec's response examples. Titles are the provider's own response
  descriptions, not paraphrases.
