      description: Machine-readable error identifier.
    - name: Message
      type: string
      description: Human-readable message, often interpolating the offending identifiers.
    - name: ErrorDetail
      type: array
      items: '{Key: string, Value: string}'
      description: Structured detail pairs (e.g. userUuid, documentId).
