note: >-
  Tradeshift ships client-side UI components for apps that run embedded inside the Tradeshift platform. Two families:
  the older Tradeshift UI library/framework, and Tradeshift Elements — the same design system as framework-agnostic
  Web Components, published as individually installable npm packages. These are distinct from the server-side SDKs in
  packages/.
